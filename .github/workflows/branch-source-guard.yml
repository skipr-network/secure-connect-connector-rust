name: Branch source guard

# Copy this file into .github/workflows/ in every secure-connect-* repo.
# GitHub rulesets have no native "restrict PR source branch" rule type, so this
# workflow is what actually enforces "only develop/hotfix may PR into main" and
# "only feature/fix may PR into develop" - it's referenced as a required status
# check named "Branch source guard / verify-source-branch" in the develop and
# main ruleset JSON files. Without this workflow present and passing, that
# required check can never succeed and every PR into develop/main will be
# permanently blocked - add this workflow BEFORE activating the ruleset.

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify allowed source branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_BRANCH -> $BASE_BRANCH"
          if [ "$BASE_BRANCH" = "main" ]; then
            case "$HEAD_BRANCH" in
              develop|hotfix/*)
                exit 0
                ;;
              *)
                echo "::error::PRs into main must come from develop or a hotfix/* branch (got: $HEAD_BRANCH)"
                exit 1
                ;;
            esac
          elif [ "$BASE_BRANCH" = "develop" ]; then
            case "$HEAD_BRANCH" in
              feature/*|fix/*)
                exit 0
                ;;
              *)
                echo "::error::PRs into develop must come from a feature/* or fix/* branch (got: $HEAD_BRANCH)"
                exit 1
                ;;
            esac
          fi

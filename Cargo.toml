[package]
name = "secure_connect_connector"
version = "0.2.0"
edition = "2024"
description = "Private Gateway Connector runtime (TT-1732)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
boringtun = { version = "0.7.1", default-features = false }
tun = { version = "0.8.14", features = ["async"] }
x509-parser = "0.16"
# TT-2027 review finding #2: reads the OS trust store purely to log how many anchors it found -
# already resolved transitively via reqwest's rustls-tls-native-roots feature (Cargo.lock), so this
# adds no new dependency to the tree, just a direct name for a crate already being built.
rustls-native-certs = "0.8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Test-only: both already in the tree transitively via reqwest's rustls-tls backend (Cargo.lock
# already resolves tokio-rustls 0.26.4) - used to spin up a real TLS server in ca_trust's tests so
# `add_root_certificate` keeping hostname verification enforced (PR #11 review finding #4) is
# proven end to end, not just asserted in a comment. default-features = false + an explicit "ring"
# feature on both: their real defaults pull in aws-lc-rs, which needs a C compiler/cmake to build
# aws-lc-sys from source (PR #11 review) - ring is the same pure-Rust backend reqwest's own rustls
# dependency already uses, so this doesn't change what's trusted, only what has to compile.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
